name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: |
          chmod +x backend/mvnw
          backend/mvnw -B -f backend/pom.xml test

  data-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-engine/pyproject.toml
      - name: Install worker and test dependencies
        working-directory: data-engine
        run: python -m pip install -e '.[dev]'
      - name: Lint worker
        working-directory: data-engine
        run: ruff check src tests
      - name: Test worker
        working-directory: data-engine
        run: pytest -q

# Optional local monitoring (compose profile "observability"). Scrapes the API's /actuator/prometheus, which is
# restricted to ADMIN/VIEWER: Prometheus logs in as the read-only "viewer" user; its password is a Compose secret
# (PIDEA_METRICS_PASSWORD in .env), never written into this file.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pidea-api
    metrics_path: /actuator/prometheus
    basic_auth:
      username: viewer
      password_file: /run/secrets/pidea_metrics_password
    static_configs:
      - targets: ["api:8080"]

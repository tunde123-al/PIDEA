[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pidea-data"
version = "0.1.0"
description = "PIDEA ETL/ELT worker"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "requests>=2.32.3,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "responses>=0.25",
    "testcontainers[postgres]>=4.8",
    "bcrypt>=4.1,<6",
    "trustme>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long SQL strings; formatting is not enforced by line length
